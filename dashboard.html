<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMELCO — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f2f5;--bg2:#ffffff;--bg3:#f5f6f8;--border:#dde1e9;--border2:#c8cdd8;--accent:#d4820a;--accent-soft:rgba(212,130,10,.12);--on-accent:#000;--green:#1a8c52;--red:#c0392b;--blue:#2563eb;--text:#1a1e2e;--text2:#5a6175;--text3:#9099b0;--card:#fff;--input-bg:#f8f9fb;--radius:10px}
body.role-operations{--accent:#2563eb;--accent-soft:rgba(37,99,235,.12);--on-accent:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;font-size:14px;min-height:100vh}
.header{background:var(--bg2);border-bottom:1px solid var(--border);border-top:5px solid var(--accent);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;gap:10px;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:12px}
.logo-mark{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-weight:500;font-size:13px;color:var(--on-accent)}
.logo-text{font-weight:700;font-size:16px}.logo-sub{font-size:11px;color:var(--text2);font-weight:300}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;background:var(--accent);color:var(--on-accent)}
.who{font-size:12px;color:var(--text2);font-weight:600}
#sync-status{font-size:11px;color:var(--text2)}
.btn{padding:8px 14px;border-radius:var(--radius);border:none;cursor:pointer;font-family:'Sora',sans-serif;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-ghost{background:var(--bg3);color:var(--text);border:1px solid var(--border2)}.btn-ghost:hover{background:var(--border2)}
.layout{display:flex;min-height:calc(100vh - 64px)}
.nav{width:190px;flex:none;background:var(--bg2);border-right:1px solid var(--border);padding:14px 10px}
.nav a{display:block;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text2);text-decoration:none;margin-bottom:2px}
.nav a:hover{background:var(--bg3);color:var(--text)}
.nav a.cur{background:var(--accent-soft);color:var(--accent)}
.main{flex:1;min-width:0;padding:20px;max-width:1200px;margin:0 auto}
.title{font-size:18px;font-weight:700;margin-bottom:4px}
.sub{font-size:12px;color:var(--text2);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card.wide{grid-column:1/-1}
.lbl{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.big{font-size:26px;font-weight:700;font-family:'DM Mono',monospace;line-height:1.2}
.small{font-size:11px;color:var(--text2);margin-top:3px;line-height:1.5}
.meter{position:relative;height:10px;background:var(--bg3);border-radius:4px;margin-top:12px}
.meter i{display:block;height:10px;border-radius:4px}
.meter b{position:absolute;top:-3px;width:2px;height:16px;background:var(--text)}
.bars{display:flex;align-items:flex-end;gap:8px;height:100px;margin-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--text3)}
.bars span{display:block;width:100%;max-width:30px;border-radius:4px 4px 0 0;margin-bottom:3px}
.hrow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px}
.hrow .n{width:78px;color:var(--text2)}.hrow .t{flex:1;height:10px;background:var(--bg3);border-radius:3px}.hrow .t i{display:block;height:10px;border-radius:3px}.hrow .v{width:70px;text-align:right;font-family:'DM Mono',monospace;font-size:11px}
.mono{font-family:'DM Mono',monospace}
.muted{color:var(--text3)}
.pos{color:var(--green)}.neg{color:var(--red)}
a.card-link{display:block;text-decoration:none;color:inherit}
table.log{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
table.log td{padding:5px 4px;border-bottom:1px solid var(--border)}
.fc-row{display:grid;grid-template-columns:62px 1fr 150px;gap:10px;align-items:center;margin-top:9px;font-size:12px}
.fc-row .m{color:var(--text2);font-weight:600}
.fc-track{position:relative;height:14px;background:var(--bg3);border-radius:4px}
.fc-track .rg{position:absolute;top:0;height:14px;background:rgba(37,99,235,.22);border-radius:4px}
.fc-track .md{position:absolute;top:3px;height:8px;background:#2a78d6;border-radius:3px}
.fc-row .v{text-align:right;font-family:'DM Mono',monospace;font-size:11px;line-height:1.3}.fc-row .v small{display:block;color:var(--text3);font-size:10px}
.fc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:6px}
.fc-stats .big{font-size:20px}
table.fc{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
table.fc th{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;text-align:right;padding:4px 4px;border-bottom:1px solid var(--border)}
table.fc th:first-child,table.fc td:first-child{text-align:left}
table.fc td{padding:6px 4px;border-bottom:1px solid var(--border);text-align:right;font-family:'DM Mono',monospace;font-size:11px}
table.fc td:first-child{font-family:'Sora',sans-serif;color:var(--text2)}
table.fc tr.tot td{font-weight:700;background:var(--bg3)}
@media(max-width:760px){.fc-row{grid-template-columns:48px 1fr 110px}}
/* login */
.login-overlay{position:fixed;inset:0;background:rgba(24,28,42,.97);z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px}
.login-overlay.hidden{display:none}
.login-box{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:30px;width:100%;max-width:380px}
.login-title{font-weight:800;font-size:18px;margin-bottom:4px}
.login-desc{font-size:11px;color:var(--text2);margin-bottom:18px}
.role-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.role-opt{border:1px solid var(--border2);border-radius:10px;padding:12px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;color:var(--text2)}
.role-opt.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.form-input{background:var(--input-bg);border:1px solid var(--border2);border-radius:8px;padding:9px 11px;color:var(--text);font-family:'Sora',sans-serif;font-size:13px;width:100%;margin-bottom:8px}
.login-error{color:var(--red);font-size:11px;min-height:14px;margin-bottom:6px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--border2);border-left:3px solid var(--red);border-radius:var(--radius);padding:10px 14px;font-size:12px;z-index:2000}
@media(max-width:760px){.layout{flex-direction:column}.nav{width:100%;display:flex;gap:4px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:8px}.nav a{white-space:nowrap;margin:0}.header{padding:0 12px}.logo-sub{display:none}.main{padding:12px}}
</style>
</head>
<body>

<div class="login-overlay" id="login-overlay">
  <div class="login-box">
    <div class="login-title">EMELCO Logistics</div>
    <div class="login-desc">One login opens every module. Select role, pick your name and enter the access code</div>
    <div class="role-picker">
      <div class="role-opt active" id="pick-owner" onclick="pickRole('owner')">Management</div>
      <div class="role-opt" id="pick-operations" onclick="pickRole('operations')">Operations</div>
    </div>
    <select class="form-input" id="login-name"></select>
    <input type="password" class="form-input" id="login-pass" placeholder="Access code" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="login-error" id="login-error"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="doLogin()">Unlock</button>
  </div>
</div>

<div id="emelco-bar" data-page="dashboard" data-sub="Overview of all modules"></div>
<script src="shell.js"></script>

<div class="layout">
  <div class="main" id="main"></div>
</div>
<div id="toast-box"></div>

<script>
const APP_VERSION='202611072000'; // Dashboard v2.2 — adds received-last-4-weeks figure

const PROXY_URL='https://emelco-proxy.rchbas.workers.dev';
const PROXY_SECRET='emelco1254rch';
const HDRS={'X-Proxy-Auth':PROXY_SECRET,Accept:'application/vnd.github.v3+json'};
const api=f=>`${PROXY_URL}/contents/${f}`;
const F_EXP='emelco_expenses_2026.json', F_FLEET='emelco_fleet_2026.json', F_TRIPS='emelco_data.json', F_PAY='emelco_payroll_2026.json', F_BILL='emelco_billing_2026.json', F_LOG='emelco_login_log_2026.json';
const ACCESS_CODES={owner:'emelco2026',operations:'ops2026'};
// Names offered at login. Edit these lists when staff change.
const NAMES={owner:['Ruchan','Rhoda','Michelle'],operations:['Michelle','Llhen','Jhen','Ric']};
const OPEX_RATE=0.25;
const LINKS={
  owner:[['Dashboard','dashboard.html'],['Trips','index.html'],['Assignment','assignment.html'],['Billing','billing.html'],['Fleet','fleet.html'],['Expenses','expenses.html']],
  operations:[['Dashboard','dashboard.html'],['Trips','index.html'],['Assignment','assignment.html'],['Fleet','fleet.html'],['Expenses','expenses.html']]
};

const $=s=>document.querySelector(s);
const n=v=>Number(v)||0;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nowISO=()=>new Date().toISOString();
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const monthOf=d=>String(d||'').slice(0,7);
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function addMonths(ym,k){const [y,m]=ym.split('-').map(Number);const t=y*12+(m-1)+k;return `${Math.floor(t/12)}-${String(t%12+1).padStart(2,'0')}`;}
const dAdd=(iso,d)=>{const t=new Date(iso+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+d);return t.toISOString().slice(0,10);};
const dDiff=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/86400000);
function compact(v){v=n(v);const s=v<0?'-':'';v=Math.abs(v);if(v>=1e6)return s+'₱'+(v/1e6).toFixed(2)+'M';if(v>=1e3)return s+'₱'+Math.round(v/1e3).toLocaleString()+'k';return s+'₱'+Math.round(v);}
const peso=v=>'₱'+n(v).toLocaleString('en-PH',{maximumFractionDigits:0});
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toast-box').appendChild(t);setTimeout(()=>t.remove(),4500);}
function safeAtobUtf8(b64){const bin=atob(b64.replace(/\n/g,''));const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(b);}
function toB64Utf8(s){return btoa(unescape(encodeURIComponent(s)));}

async function getJSON(file){
  const r=await fetch(api(file)+'?t='+Date.now(),{headers:HDRS});
  if(r.status===404) return {missing:true};
  if(!r.ok) throw new Error(file+' '+r.status);
  const meta=await r.json(); let text;
  if(meta.content&&meta.encoding==='base64') text=safeAtobUtf8(meta.content);
  else{const b=await fetch(`${PROXY_URL}/git/blobs/${meta.sha}`,{headers:HDRS});if(!b.ok)throw new Error('blob '+b.status);text=safeAtobUtf8((await b.json()).content);}
  return {sha:meta.sha,data:JSON.parse(text)};
}

/* ---------- login / roles ---------- */
let role=null, userName='', pickedRole='owner';
const isOwner=()=>role==='owner';
function fillNames(){ $('#login-name').innerHTML='<option value="">— pick your name —</option>'+NAMES[pickedRole].map(x=>`<option>${esc(x)}</option>`).join(''); }
function pickRole(r){pickedRole=r;$('#pick-owner').classList.toggle('active',r==='owner');$('#pick-operations').classList.toggle('active',r==='operations');$('#login-error').textContent='';$('#login-pass').value='';fillNames();}
/* One login for every module: the session lives in shell.js (EM.*). This page is the front door —
   modules without a session send people here with ?next=<page>, and after sign-in we go straight back. */
const waitMax=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(r,ms))]);
const nextPage=()=>{const f=EM.safeNext(new URLSearchParams(location.search).get('next'));return (f&&f!=='dashboard.html')?f:null;};
async function doLogin(){
  const nm=$('#login-name').value, p=$('#login-pass').value.trim();
  if(!nm){$('#login-error').textContent='Pick your name.';return;}
  if(p!==ACCESS_CODES[pickedRole]){$('#login-error').textContent='Incorrect access code.';return;}
  setRole(pickedRole,nm); $('#login-overlay').classList.add('hidden');
  await waitMax(logEvent('in'),4000);
  const nx=nextPage(); if(nx){ location.href=nx; return; }
  boot();
}
function setRole(r,nm){
  role=r; userName=nm;
  EM.setSession(r,nm);
  document.body.classList.toggle('role-operations',r==='operations');
  EM.mount();
}
// Log off is handled by the top bar (EM.logoff -> dashboard.html?logoff=1), so the log entry is written here.
function doLogout(){ EM.logoff(); }
function initGate(){
  const q=new URLSearchParams(location.search), s=EM.getSession();
  if(q.get('logoff')==='1'){
    if(s){ role=s.role; userName=s.name; waitMax(logEvent('out'),4000).finally(()=>{EM.clearSession();location.replace('dashboard.html');}); }
    else location.replace('dashboard.html');
    return false;
  }
  if(s){
    setRole(s.role,s.name); $('#login-overlay').classList.add('hidden');
    const nx=nextPage(); if(nx){ location.replace(nx); return false; }
    return true;
  }
  return false;
}

/* ---------- login log (the only thing this page writes) ---------- */
async function logEvent(action){
  try{
    const got=await getJSON(F_LOG);
    const data=got.missing?{entries:[]}:got.data; data.entries=data.entries||[];
    data.entries.push({name:userName,role,action,at:nowISO()});
    data.entries=data.entries.slice(-500);
    const body={message:'Dashboard log '+action,content:toB64Utf8(JSON.stringify(data,null,2))};
    if(got.sha) body.sha=got.sha;
    const r=await fetch(api(F_LOG),{method:'PUT',headers:{...HDRS,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error('PUT '+r.status);
  }catch(e){ console.warn('login log failed',e); toast('Login was not recorded (add "'+F_LOG+'" to the Worker ALLOWED_PATHS).'); }
}

/* ---------- data ---------- */
const D={exp:null,fleet:null,trips:null,pay:null,bill:null,log:null,err:{}};
async function load(key,file,fn){
  try{const got=await getJSON(file);D[key]=got.missing?{}:got.data;if(fn)fn(D[key]);}
  catch(e){D.err[key]=String(e.message||e);console.warn(e);}
  render();
}
function boot(){
  $('#sync-status').textContent='loading…';
  render();
  load('trips',F_TRIPS,prepTrips);
  load('fleet',F_FLEET);
  if(isOwner()){ load('exp',F_EXP); load('pay',F_PAY,preparePay); load('bill',F_BILL); load('log',F_LOG); }
}

let T={list:[]};
function prepTrips(d){
  T.list=((d&&d.trips)||[]).map(t=>{
    const rs=n(t.rate)+n(t.surcharge);
    const dEnt=Array.isArray(t.dieselEntries)?t.dieselEntries.reduce((s,x)=>s+n(x.amount),0):0;
    const diesel=dEnt||(n(t.dieselPrice)*n(t.dieselLiter));
    const cost=diesel+n(t.toll)+n(t.food)+n(t.passway)+n(t.parking)+n(t.checker)+n(t.load)+n(t.gcash)+n(t.maint)+n(t.otherExp)+n(t.manoDrv)+n(t.manoH1)+n(t.manoH2)+n(t.manoOthers)+n(t.drvPay)+n(t.h1Pay)+n(t.h2Pay);
    return {start:String(t.tripStartDate||'').slice(0,10),rs,diesel,cost,client:t.client||'',status:String(t.status||'').toLowerCase(),cutoff:String(t.cutoff||'').trim()};
  }).filter(t=>t.start);
}
let PAYM={};
function preparePay(d){
  const slips=Object.values((d&&d.officeSlips)||{}).filter(x=>x&&x.finalizedAt&&x.periodStart);
  const list=slips.map(x=>({key:x.staffId||x.name||'?',start:String(x.periodStart).slice(0,10),end:String(x.periodEnd||x.periodStart).slice(0,10),fin:x.finalizedAt,
    gross:n(x.standardPay)+n(x.holidayPay)+n(x.paidLeave)+n(x.bonus)+n(x.thirteenthMonth)+n(x.otherPay)}));
  // same rule as the Expenses page: overlapping slips for one person -> only the newest finalized counts
  const kept={}; PAYM={};
  list.sort((a,b)=>String(b.fin).localeCompare(String(a.fin))).forEach(r=>{
    kept[r.key]=kept[r.key]||[];
    const clash=kept[r.key].find(o=>dDiff(r.start>o.start?r.start:o.start,r.end<o.end?r.end:o.end)>=1);
    if(!clash){kept[r.key].push(r);const mo=r.start.slice(0,7);PAYM[mo]=(PAYM[mo]||0)+r.gross;}
  });
}

/* ---------- calculations (same rules as expenses.html) ---------- */
function catMap(){const m={};((D.exp&&D.exp.categories)||[]).forEach(c=>m[c.id]=c);return m;}
function realByMonth(){
  const cm=catMap(), out={}, has={};
  const add=(ym,a)=>{out[ym]=(out[ym]||0)+a;};
  ((D.exp&&D.exp.entries)||[]).forEach(e=>{
    const mo=monthOf(e.date); if(!mo) return; has[mo]=1;
    const c=cm[e.catId], a=n(e.amount);
    if(c&&(c.type==='yearly'||c.type==='quarterly')){const N=c.type==='yearly'?12:3,back=c.spread==='back';for(let i=0;i<N;i++)add(addMonths(mo,back?-i:i),a/N);}
    else add(mo,a);
  });
  ((D.fleet&&D.fleet.maintenance)||[]).forEach(m=>{const mo=monthOf(m.date);if(mo){has[mo]=1;add(mo,n(m.amount));}});
  Object.keys(PAYM).forEach(ym=>add(ym,PAYM[ym]));
  return {out,has};
}
function revByMonth(){const m={};T.list.forEach(t=>{const mo=t.start.slice(0,7);m[mo]=(m[mo]||0)+t.rs;});return m;}

/* ---------- rendering ---------- */
function card(label,body,extra){return `<div class="card ${extra||''}"><div class="lbl">${label}</div>${body}</div>`;}
function loading(key,what){ if(D.err[key]) return `<div class="small neg">Could not read ${what}: ${esc(D.err[key])}</div>`; return `<div class="small muted">Loading ${what}…</div>`; }
function hrow(name,val,max,color,txt){return `<div class="hrow"><span class="n">${esc(name)}</span><span class="t"><i style="width:${max>0?Math.round(val/max*100):0}%;background:${color}"></i></span><span class="v">${txt}</span></div>`;}

function revenueCard(){
  if(!D.trips) return card('Revenue, last 6 months',loading('trips','trips'));
  const rev=revByMonth(), thisM=todayISO().slice(0,7), ms=[];
  for(let i=5;i>=0;i--) ms.push(addMonths(thisM,-i));
  const vals=ms.map(m=>rev[m]||0), mx=Math.max(...vals,1);
  const bars='<div class="bars">'+ms.map((m,i)=>`<div><span style="height:${Math.round(vals[i]/mx*80)}px;background:${i===5?'#2a78d6':'#b5d4f4'}"></span>${MONTHS[Number(m.slice(5))-1]}</div>`).join('')+'</div>';
  return card('Revenue, last 6 months (Rate + Surcharge)',`<div class="big">${compact(vals[5])}</div><div class="small">This month so far · last month ${compact(vals[4])}</div>${bars}`);
}
function opexCard(){
  if(!D.exp||!D.trips||!D.pay) return card('Real OPEX %',loading(D.err.exp?'exp':(D.err.trips?'trips':'pay'),'expenses, trips and payroll'));
  const {out,has}=realByMonth(), rev=revByMonth(), thisM=todayISO().slice(0,7);
  let ym=null; for(let i=1;i<=6;i++){const m=addMonths(thisM,-i);if(has[m]&&rev[m]){ym=m;break;}}
  if(!ym) return card('Real OPEX %','<div class="small muted">No complete month with both expenses and revenue yet.</div>');
  const real=out[ym]||0, pct=real/rev[ym]*100;
  return card('Real OPEX %',`<div class="big">${pct.toFixed(1)}%</div><div class="small">${MONTHS[Number(ym.slice(5))-1]} ${ym.slice(0,4)} · real ${compact(real)} vs 25% estimate ${compact(rev[ym]*OPEX_RATE)}</div>
    <div class="meter"><i style="width:${Math.min(100,pct/40*100)}%;background:${pct>25?'#eb6834':'#1baf7a'}"></i><b style="left:${25/40*100}%"></b></div><div class="small muted">Line marks the old flat 25%</div>`);
}
function cushionCard(){
  if(!D.exp||!D.pay) return card('Cash cushion',loading(D.err.exp?'exp':'pay','expenses'));
  const c=(D.exp.cushion)||{}; if(c.cash==null) return card('Cash cushion','<div class="small muted">No cash figure entered yet. Set it in Expenses → Cushion.</div>');
  const {out,has}=realByMonth(), thisM=todayISO().slice(0,7);
  const used=[1,2,3].map(k=>addMonths(thisM,-k)).filter(m=>has[m]&&(out[m]||0)>0);
  const avg=used.length?used.reduce((s,m)=>s+out[m],0)/used.length:0;
  const rate=c.costOverride!=null?n(c.costOverride):avg;
  const min=c.minMode==='months'?n(c.minValue)*rate:n(c.minValue), cash=n(c.cash), above=cash-min;
  const top=Math.max(cash,min,1);
  return card('Cash cushion',`<div class="big">${compact(cash)}</div><div class="small">Minimum to keep ${compact(min)} · <span class="${above<0?'neg':'pos'}">${above<0?'below':'above'} the minimum by ${compact(Math.abs(above))}</span></div>
    <div class="meter"><i style="width:${Math.round(cash/top*100)}%;background:#1baf7a"></i><b style="left:${Math.round(min/top*100)}%"></b></div><div class="small muted">Line marks the minimum · cash as entered ${esc(c.cashDate||'')}. The month-by-month forecast is in Expenses → Cushion.</div>`);
}
function receivablesCard(){
  if(!D.bill) return card('Receivables by age',loading('bill','billing'));
  const today=todayISO(), B=[['Not yet due',0,'#2a78d6'],['1–30 days late',0,'#eda100'],['31–60 days late',0,'#eb6834'],['61+ days late',0,'#e34948']];
  let total=0,cnt=0;
  ((D.bill.entries)||[]).filter(e=>!e.voided&&e.status==='submitted'&&e.submitted).forEach(e=>{
    const due=(n(e.net)-n(e.penalty))*1.10, late=dDiff(dAdd(e.submitted,n(e.dueDays)||30),today);
    B[late<=0?0:late<=30?1:late<=60?2:3][1]+=due; total+=due; cnt++;
  });
  const mx=Math.max(...B.map(b=>b[1]),1);
  return card('Receivables by age (submitted, unpaid)',`<div class="big">${compact(total)}</div><div class="small">${cnt} submitted billing entries · cash after VAT/WHT</div>`+B.map(b=>hrow(b[0],b[1],mx,b[2],compact(b[1]))).join(''));
}
function truckCostCard(){
  if(!D.exp||!D.fleet) return card('Cost per truck',loading(D.err.exp?'exp':'fleet','expenses and fleet'));
  const y=todayISO().slice(0,4), m={};
  ((D.exp.entries)||[]).forEach(e=>{if(e.plate&&String(e.date).slice(0,4)===y)m[e.plate]=(m[e.plate]||0)+n(e.amount);});
  ((D.fleet.maintenance)||[]).forEach(x=>{if(x.plate&&String(x.date).slice(0,4)===y)m[x.plate]=(m[x.plate]||0)+n(x.amount);});
  const rows=Object.keys(m).map(k=>[k,m[k]]).sort((a,b)=>b[1]-a[1]).slice(0,6), mx=rows.length?rows[0][1]:1;
  return card('Cost per truck, '+y+' (top 6)',(rows.length?rows.map(r=>hrow(r[0],r[1],mx,'#2a78d6',compact(r[1]))).join(''):'<div class="small muted">No plate-tagged costs yet.</div>')+'<div class="small muted" style="margin-top:10px">Plate-tagged expenses plus Fleet maintenance. Trip running costs are not included yet.</div>','wide');
}
function logCard(){
  if(!D.log) return card('Recent logins',loading('log','login log'));
  const rows=((D.log.entries)||[]).slice(-8).reverse();
  return card('Recent logins',rows.length?'<table class="log">'+rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="muted">${esc(r.role)}</td><td>${r.action==='in'?'logged in':'logged off'}</td><td class="muted mono">${esc(String(r.at).replace('T',' ').slice(0,16))} UTC</td></tr>`).join('')+'</table>':'<div class="small muted">Nothing recorded yet.</div>');
}

/* ---------- cash forecast: expected collections + cash needed (same rules as Expenses → Cushion) ---------- */
function fcLags(){
  const paid=((D.bill&&D.bill.entries)||[]).filter(e=>!e.voided&&e.status==='paid'&&e.paidDate&&e.submitted);
  const q=(a,p)=>{a=a.filter(x=>x>=0).sort((x,y)=>x-y);if(!a.length)return null;if(p===.5)return a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2;return a[Math.round(p*(a.length-1))];};
  const out={};
  const calc=(rows,kind)=>{const mk=e=>kind==='s'?dDiff(e.submitted,e.paidDate):(e.tripEnd?dDiff(e.tripEnd,e.paidDate):-1);const a=rows.map(mk);return {early:q(a,.25),med:q(a,.5),late:q(a,.75),n:a.filter(x=>x>=0).length};};
  const all={s:calc(paid,'s'),t:calc(paid,'t')};
  ['CCAC','CMIP','CDI'].forEach(bu=>{
    const rows=paid.filter(e=>e.bu===bu), s=calc(rows,'s'), t=calc(rows,'t');
    out[bu]={s:s.n>=5?s:all.s,t:t.n>=5?t:all.t};
  });
  out._all=all;
  return out;
}
const NEED_M=4; // cash-needed window: this month + next 3 (new-trip income lands ~2 months after costs, so a longer window would only show the edge of the forecast)
function fcModel(){
  const today=todayISO(), thisM=today.slice(0,7), H=6, months=[]; for(let i=0;i<H;i++) months.push(addMonths(thisM,i));
  const mi={}; months.forEach((m,i)=>mi[m]=i);
  const L=fcLags(), pickLag=(bu,kind,sc)=>{const o=(L[bu]||L._all)[kind];const v=sc==='early'?o.early:sc==='late'?o.late:o.med;return Math.round(v==null?(kind==='s'?50:60):v);};
  const soon=dAdd(today,7);
  const subs=((D.bill&&D.bill.entries)||[]).filter(e=>!e.voided&&e.status==='submitted'&&e.submitted).map(e=>({bu:e.bu,sub:e.submitted,due:(n(e.net)-n(e.penalty))*1.10,terms:n(e.dueDays)||30}));
  const unb=T.list.filter(t=>t.status==='completed'&&['CCAC','CMIP','CDI'].includes(t.client)&&!t.cutoff).map(t=>({bu:t.client,start:t.start,due:t.rs*1.10}));
  const scen={};
  ['early','med','late'].forEach(sc=>{
    const sub=months.map(()=>0), un=months.map(()=>0), wk=[0,0,0,0,0,0,0,0]; let laterS=0, laterU=0, n30=0, overdue=0, overdueN=0, wkLater=0;
    const addWk=(d,v)=>{const w=Math.floor(dDiff(today,d)/7); if(w>=1&&w<=8) wk[w-1]+=v; else if(w>8) wkLater+=v;};
    subs.forEach(e=>{const d0=dAdd(e.sub,pickLag(e.bu,'s',sc)), od=d0<soon, d=od?soon:d0; if(od){overdue+=e.due;overdueN++;} else addWk(d,e.due); const i=mi[d.slice(0,7)]; if(i===undefined) laterS+=e.due; else sub[i]+=e.due; if(d<=dAdd(today,30)) n30+=e.due;});
    unb.forEach(e=>{let d=dAdd(e.start,pickLag(e.bu,'t',sc)); const d2=dAdd(today,pickLag(e.bu,'s',sc)); if(d<d2) d=d2; addWk(d,e.due); const i=mi[d.slice(0,7)]; if(i===undefined) laterU+=e.due; else un[i]+=e.due; if(d<=dAdd(today,30)) n30+=e.due;});
    scen[sc]={sub,un,laterS,laterU,n30,overdue,overdueN,wk,wkLater};
  });
  const subTotal=subs.reduce((a,e)=>a+e.due,0), unbTotal=unb.reduce((a,e)=>a+e.due,0);
  const from28=dAdd(today,-28), rec=((D.bill&&D.bill.entries)||[]).filter(e=>!e.voided&&e.status==='paid'&&e.paidDate&&String(e.paidDate).slice(0,10)>=from28&&String(e.paidDate).slice(0,10)<=today), recAmt=rec.reduce((a,e)=>a+(n(e.net)-n(e.penalty))*1.10,0);
  const termsLate=subs.filter(e=>dAdd(e.sub,e.terms)<today), termsLateAmt=termsLate.reduce((a,e)=>a+e.due,0);
  // costs: recent monthly run-rate (same months/rules as the cushion card), trips' running costs, new-trip income arriving ~2 months later
  const c=(D.exp&&D.exp.cushion)||{}, {out:ro,has}=realByMonth(), recent=[1,2,3].map(k=>addMonths(thisM,-k));
  const used=recent.filter(m=>has[m]&&(ro[m]||0)>0), auto=used.length?used.reduce((a,m)=>a+ro[m],0)/used.length:0;
  const rate=c.costOverride!=null?n(c.costOverride):auto;
  const dim=new Date(Number(thisM.slice(0,4)),Number(thisM.slice(5,7)),0).getDate(), dayN=Number(today.slice(8,10));
  const outFix=months.map((m,i)=>i===0?rate*((dim-dayN+1)/dim):rate);
  const tm=ym=>T.list.filter(t=>t.start.slice(0,7)===ym), tUsed=recent.filter(ym=>tm(ym).length);
  let avgCost=0, avgDue=0;
  if(tUsed.length){avgCost=tUsed.reduce((a,ym)=>a+tm(ym).reduce((x,t)=>x+t.cost,0),0)/tUsed.length; avgDue=tUsed.reduce((a,ym)=>a+tm(ym).reduce((x,t)=>x+t.rs*1.10,0),0)/tUsed.length;}
  const outTrip=months.map((m,i)=>i>=1?avgCost:0);
  const contIn=sc=>{const lag=sc==='late'?3:2; return months.map((m,i)=>(i>=1+lag)?avgDue:0);};
  const minAmt=c.minMode==='months'?n(c.minValue)*rate:n(c.minValue), cash=c.cash==null?null:n(c.cash);
  const res={};
  ['early','med','late'].forEach(sc=>{
    const S=scen[sc], cin=contIn(sc), inn=months.map((m,i)=>S.sub[i]+S.un[i]+cin[i]), outt=months.map((m,i)=>outFix[i]+outTrip[i]);
    let cum=0, worst=0, wi=0; const net=[], cumA=[];
    months.forEach((m,i)=>{const x=inn[i]-outt[i]; net.push(x); cum+=x; cumA.push(cum); if(i<NEED_M&&cum<worst){worst=cum;wi=i;}});
    res[sc]={inn,outt,net,cumA,needed:minAmt-worst,worstIdx:wi};
  });
  return {today,months,scen,res,recAmt,recN:rec.length,termsLateAmt,termsLateN:termsLate.length,subTotal,unbTotal,subN:subs.length,unbN:unb.length,L,rate,used,minAmt,cash,cashDate:c.cashDate||'',outFix,outTrip,avgCost};
}
function fcReady(){return D.bill&&D.trips&&D.exp&&D.pay&&D.fleet;}
function fcMonthLbl(m){return MONTHS[Number(m.slice(5))-1]+' '+m.slice(2,4);}
function collectionsCard(){
  if(!fcReady()) return card('Expected collections',loading(D.err.bill?'bill':(D.err.trips?'trips':'exp'),'billing, trips and expenses'),'wide');
  const M=fcModel(), E=M.scen.early, Md=M.scen.med, La=M.scen.late;
  const tot=(S,i)=>S.sub[i]+S.un[i];
  const vals=M.months.map((m,i)=>[tot(E,i),tot(Md,i),tot(La,i)]);
  const mx=Math.max(...vals.map(v=>Math.max(...v)),1);
  const pct=v=>Math.round(v/mx*100);
  const rows=M.months.map((m,i)=>{const v=vals[i], lo=Math.min(...v), hi=Math.max(...v);
    return `<div class="fc-row"><span class="m">${fcMonthLbl(m)}</span><span class="fc-track"><i class="rg" style="left:${pct(lo)}%;width:${Math.max(1,pct(hi)-pct(lo))}%"></i><i class="md" style="left:0;width:${pct(v[1])}%"></i></span><span class="v">${compact(v[1])}<small>${compact(lo)} – ${compact(hi)}</small></span></div>`;}).join('');
  const wv=Md.wk.map((v,i)=>[E.wk[i],v,La.wk[i]]), wmx=Math.max(...wv.map(v=>Math.max(...v)),Md.overdue,1), wp=v=>Math.round(v/wmx*100);
  const dl=iso=>{const d=new Date(iso+'T00:00:00Z');return d.getUTCDate()+' '+MONTHS[d.getUTCMonth()];};
  const wrows=wv.map((v,i)=>{const st=dAdd(M.today,7*(i+1)), lo=Math.min(...v), hi=Math.max(...v);
    return `<div class="fc-row"><span class="m">${dl(st)}</span><span class="fc-track"><i class="rg" style="left:${wp(lo)}%;width:${Math.max(1,wp(hi)-wp(lo))}%"></i><i class="md" style="left:0;width:${wp(v[1])}%"></i></span><span class="v">${compact(v[1])}<small>${compact(lo)} – ${compact(hi)}</small></span></div>`;}).join('');
  const wlater=Md.wkLater>0?`<div class="fc-row"><span class="m">Later</span><span class="fc-track"></span><span class="v">${compact(Md.wkLater)}</span></div>`:'';
  const odRow=Md.overdue>0?`<div class="fc-row"><span class="m" style="color:#b45309">Overdue</span><span class="fc-track"><i class="md" style="left:0;width:${wp(Md.overdue)}%;background:#eda100"></i></span><span class="v" style="color:#b45309">${compact(Md.overdue)}<small>${Md.overdueN} invoices · past usual pay time · chase now</small></span></div>`:'';
  const weekly=`<div class="lbl" style="margin-top:14px">Week by week (starting date of each week)</div>`+odRow+wrows+wlater+`<div class="small muted" style="margin-top:8px">Overdue = later than that client's usual days-to-pay, so not counted in any week. By the 30-day terms, ${compact(M.termsLateAmt)} (${M.termsLateN} invoices) is past due.</div><div class="lbl" style="margin-top:18px">Month by month</div>`;
  const lateM=Md.laterS+Md.laterU;
  const later=lateM>0?`<div class="fc-row"><span class="m">Later</span><span class="fc-track"></span><span class="v">${compact(lateM)}</span></div>`:'';
  const lc=['CCAC','CMIP'].map(b=>{const s=(M.L[b]||M.L._all).s;return `${b} ${Math.round(s.med)} days (${Math.round(s.early)}–${Math.round(s.late)})`;}).join(' · ');
  return card('Expected collections — when the money should land',
    `<div class="fc-stats">
      <div><div class="big">${compact(M.subTotal+M.unbTotal)}</div><div class="small">Still to collect (after VAT/WHT)</div></div>
      <div><div class="big">${compact(M.subTotal)}</div><div class="small">${M.subN} submitted invoices</div></div>
      <div><div class="big">${compact(M.unbTotal)}</div><div class="small">${M.unbN} completed trips not yet billed</div></div>
      <div><div class="big">${compact(M.recAmt)}</div><div class="small">Received in the last 4 weeks · ${M.recN} invoices</div></div>
      <div><div class="big">${compact(Md.n30)}</div><div class="small">Expected within 30 days${Md.overdue>0?` · incl. ${compact(Md.overdue)} already past usual time`:''}</div></div>
    </div>`+weekly+rows+later+
    `<div class="small muted" style="margin-top:12px">Dark bar = typical timing (median). Light band = early to slow payment (middle 50% of past payers). The monthly bars below still park overdue invoices in the next 7 days. Based on real days from submission to payment: ${lc}. Anything already past its usual payment time is placed in the next 7 days — hopeful, not certain.</div>`,'wide');
}
function cashNeedCard(){
  if(!fcReady()) return card('Cash needed',loading(D.err.bill?'bill':(D.err.trips?'trips':'exp'),'billing, trips and expenses'),'wide');
  const M=fcModel(), R=M.res.med, S=M.res.late, hasCash=M.cash!=null;
  const gap=hasCash?M.cash-R.needed:null, gapS=hasCash?M.cash-S.needed:null;
  const stat=(lbl,val,sub,cls)=>`<div><div class="lbl">${lbl}</div><div class="big ${cls||''}">${val}</div><div class="small">${sub}</div></div>`;
  const cl=hasCash?M.months.map((m,i)=>M.cash+R.cumA[i]):null;
  const row=(lbl,arr,cls,fn)=>`<tr class="${cls||''}"><td>${lbl}</td>${arr.map(v=>`<td class="${v<0?'neg':''}">${(fn||compact)(v)}</td>`).join('')}</tr>`;
  const tbl=`<table class="fc"><thead><tr><th></th>${M.months.map(m=>`<th>${fcMonthLbl(m)}</th>`).join('')}</tr></thead><tbody>`+
    row('＋ Collections',R.inn)+row('− Monthly costs',M.outFix.map(v=>-v))+row('− Trip running costs',M.outTrip.map(v=>-v))+row('Net for the month',R.net,'tot')+
    (hasCash?row('Cash at month end',cl,'tot')+row('If payments are slow',M.months.map((m,i)=>M.cash+S.cumA[i])):'')+`</tbody></table>`;
  const worstM=fcMonthLbl(M.months[R.worstIdx>=0?R.worstIdx:0]);
  return card('Cash needed on hand',
    `<div class="fc-stats">`+
    stat('Needed on hand',compact(R.needed),`covers the next 4 months, tightest at ${worstM}, plus the minimum to keep (${compact(M.minAmt)})`)+
    stat('If payments are slow',compact(S.needed),'clients pay at the slower end of their usual range')+
    (hasCash?stat('Cash set aside',compact(M.cash),`as of ${esc(M.cashDate||'—')}`):stat('Cash set aside','—','enter it in Expenses → Cushion'))+
    (hasCash?stat(gap>=0?'Spare vs typical':'Short vs typical',compact(Math.abs(gap)),gapS>=0?'still covered if payments are slow':`slow case is short by ${compact(Math.abs(gapS))}`,gap>=0?'pos':'neg'):'')+
    `</div>`+tbl+
    `<div class="small muted" style="margin-top:10px">Monthly costs ${compact(M.rate)} (${M.used.length?'average of '+M.used.map(m=>MONTHS[Number(m.slice(5))-1]).join(', '):'no complete month of expenses yet'}). New trips are assumed at the recent monthly average: about ${compact(M.avgCost)} of running costs go out each month and the money arrives about 2 months later. Months with missing expense entries make this look better than it is. Full detail is in Expenses → Cushion.</div>`,'wide');
}
/* operations cards */
function tripsTodayCard(){
  if(!D.trips) return card('Trips today',loading('trips','trips'));
  const t=todayISO(); return card('Trips today',`<div class="big">${T.list.filter(x=>x.start===t).length}</div><div class="small">Trips with a start date of today</div>`);
}
function trucksCard(){
  if(!D.fleet) return card('Trucks',loading('fleet','fleet'));
  const tr=((D.fleet.trucks)||[]).filter(x=>x.plate), act=tr.filter(x=>x.status!=='Retired');
  return card('Trucks',`<div class="big">${act.length}</div><div class="small">Active trucks in the fleet registry (${tr.length-act.length} retired)</div>`);
}
function fuelWeekCard(){
  if(!D.trips) return card('Fuel this week',loading('trips','trips'));
  const to=todayISO(), from=dAdd(to,-6), s=T.list.filter(x=>x.start>=from&&x.start<=to).reduce((a,x)=>a+x.diesel,0);
  return card('Fuel this week',`<div class="big">${peso(s)}</div><div class="small">Diesel on trips started in the last 7 days</div>`);
}
function expensesLinkCard(){
  return `<a class="card card-link" href="expenses.html"><div class="lbl">Expenses</div><div class="big" style="font-size:18px">Add an expense</div><div class="small">Opens the expense entry page</div></a>`;
}

function render(){
  if(!role) return;
  const hello=isOwner()?'Management dashboard':'Operations dashboard';
  let cards;
  if(isOwner()) cards=revenueCard()+opexCard()+cushionCard()+receivablesCard()+collectionsCard()+cashNeedCard()+truckCostCard()+logCard();
  else cards=tripsTodayCard()+trucksCard()+fuelWeekCard()+expensesLinkCard();
  $('#main').innerHTML=`<div class="title">${hello}</div><div class="sub">Read-only overview · ${new Date().toLocaleDateString('en-PH',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div class="grid">${cards}</div>`;
  const pending=isOwner()?['trips','fleet','exp','pay','bill','log']:['trips','fleet'];
  const done=pending.every(k=>D[k]||D.err[k]);
  $('#sync-status').textContent=done?(Object.keys(D.err).length?'some data unavailable':'up to date'):'loading…';
}

EM.onSync=()=>{ if(role) boot(); };
if(initGate()){boot();}else{pickRole('owner');}
</script>
